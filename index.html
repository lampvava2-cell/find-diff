<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>틀린그림찾기</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0b0b0b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .hud {
      position: absolute;
      top: env(safe-area-inset-top, 8px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
    }
    .badge {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      color: #fff;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .badge span {
      color: #ff3b30;
      font-size: 17px;
    }
    .screen-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 4px) env(safe-area-inset-right, 6px) env(safe-area-inset-bottom, 4px) env(safe-area-inset-left, 6px);
      gap: 6px;
    }
    .image-slot {
      position: relative;
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .image-frame {
      position: relative;
      display: inline-block;
      max-width: 100%;
      max-height: 100%;
      line-height: 0;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
      border: 1px solid #222;
      background: #000;
    }
    .image-frame img {
      display: block;
      max-width: 100%;
      max-height: 98vh;
      width: auto;
      height: auto;
      object-fit: contain;
      pointer-events: none;
    }
    .marker {
      position: absolute;
      width: 44px;
      height: 44px;
      border: 3.5px solid #ff2b54;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 8px rgba(255, 43, 84, 0.8);
      animation: pop 0.2s ease-out;
    }
    @keyframes pop {
      0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    .miss {
      position: absolute;
      width: 24px;
      height: 24px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      font-size: 22px;
      color: #ff3b30;
      font-weight: 900;
      animation: fadeOut 0.45s ease-out forwards;
    }
    @keyframes fadeOut {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -70%) scale(0.8); }
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      color: white;
      text-align: center;
    }
    .modal-box {
      background: #1c1c1e;
      padding: 24px 36px;
      border-radius: 14px;
      border: 1px solid #333;
    }
    .btn-restart {
      margin-top: 14px;
      padding: 10px 24px;
      font-size: 15px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="hud">
    <div class="badge">남은 틀린 곳: <span id="remaining-count">5</span></div>
  </div>

  <div class="screen-container">
    <div class="image-slot">
      <div class="image-frame" id="frame-a">
        <img src="aaa.jpg" id="img-a" alt="원본" />
      </div>
    </div>
    <div class="image-slot">
      <div class="image-frame" id="frame-b">
        <img src="bbb.jpg" id="img-b" alt="틀린그림" />
      </div>
    </div>
  </div>

  <div class="overlay" id="clear-overlay">
    <div class="modal-box">
      <h2>🎉 CLEAR!</h2>
      <p>모든 틀린 부분을 전부 찾았습니다!</p>
      <button class="btn-restart" onclick="restartGame()">다시하기</button>
    </div>
  </div>

  <script>
    const TARGET_CONFIG = [
      { id: 1, x: 81.8, y: 19.5, radius: 7.0, found: false },
      { id: 2, x: 43.1, y: 49.3, radius: 7.0, found: false },
      { id: 3, x: 17.5, y: 52.8, radius: 7.0, found: false },
      { id: 4, x: 17.8, y: 93.6, radius: 7.0, found: false },
      { id: 5, x: 77.2, y: 86.8, radius: 7.0, found: false }
    ];

    let targets = JSON.parse(JSON.stringify(TARGET_CONFIG));

    const frameA = document.getElementById('frame-a');
    const frameB = document.getElementById('frame-b');
    const remainingEl = document.getElementById('remaining-count');
    const clearOverlay = document.getElementById('clear-overlay');

    function updateRemaining() {
      const remaining = targets.filter(t => !t.found).length;
      remainingEl.textContent = remaining;
      if (remaining === 0) {
        setTimeout(() => {
          clearOverlay.style.display = 'flex';
        }, 300);
      }
    }

    function handleTouch(e, frame) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const rect = frame.getBoundingClientRect();
      const clickX = ((clientX - rect.left) / rect.width) * 100;
      const clickY = ((clientY - rect.top) / rect.height) * 100;

      const hit = targets.find(t => {
        if (t.found) return false;
        const dist = Math.hypot(clickX - t.x, clickY - t.y);
        return dist <= t.radius;
      });

      if (hit) {
        hit.found = true;
        createMarker(frameA, hit.x, hit.y);
        createMarker(frameB, hit.x, hit.y);
        updateRemaining();
      } else {
        createMiss(frame, clickX, clickY);
      }
    }

    function createMarker(parent, x, y) {
      const marker = document.createElement('div');
      marker.className = 'marker';
      marker.style.left = `${x}%`;
      marker.style.top = `${y}%`;
      parent.appendChild(marker);
    }

    function createMiss(parent, x, y) {
      const miss = document.createElement('div');
      miss.className = 'miss';
      miss.textContent = '✕';
      miss.style.left = `${x}%`;
      miss.style.top = `${y}%`;
      parent.appendChild(miss);
      setTimeout(() => miss.remove(), 450);
    }

    function restartGame() {
      targets = JSON.parse(JSON.stringify(TARGET_CONFIG));
      document.querySelectorAll('.marker, .miss').forEach(el => el.remove());
      clearOverlay.style.display = 'none';
      updateRemaining();
    }

    ['pointerdown', 'touchstart'].forEach(type => {
      frameA.addEventListener(type, (e) => { e.preventDefault(); handleTouch(e, frameA); }, { passive: false });
      frameB.addEventListener(type, (e) => { e.preventDefault(); handleTouch(e, frameB); }, { passive: false });
    });

    updateRemaining();
  </script>
</body>
</html>

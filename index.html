<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>알카노이드 FX</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
    }
    #gameContainer {
      position: relative;
      background-color: #000;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
      overflow: hidden;
    }
    /* 유튜브 영상 전체 뷰 영역: 남는 공간은 순수 Black 배경 */
    #ytPlayerWrapper {
      position: absolute;
      top: 5.625%;    /* 36 / 640 */
      left: 3.333%;   /* 12 / 360 */
      width: 93.334%; /* 336 / 360 */
      height: 94.375%;/* 604 / 640 */
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }
    /* 16:9 원본 영상 전체가 잘림 없이 들어가도록 contain 비율 설정 */
    #ytBox {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 56.25%; /* 16:9 비율 유지 */
      background: #000;
    }
    #ytBox iframe, #ytPlayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      filter: brightness(0.7) contrast(1.05); /* 게임 오브젝트 가독성을 위한 최적 밝기 */
    }
    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      background: transparent;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 10;
    }
    .btn {
      margin-top: 18px;
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      background: #e60012;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

  <div id="gameContainer">
    <!-- 레터박스(Black)와 원본 비율 전체 영상 레이어 -->
    <div id="ytPlayerWrapper">
      <div id="ytBox">
        <div id="ytPlayer"></div>
      </div>
    </div>
    <canvas id="gameCanvas"></canvas>
  </div>

  <div class="overlay" id="startOverlay">
    <h1 style="color: #ff3333; margin-bottom: 4px;">ARKANOID FX</h1>
    <p style="color: #aaa; font-size: 13px; margin-bottom: 2px;">특수 벽돌: 골드(3방), 실버(2방), 크리스탈 글래스</p>
    <p style="color: #ff0055; font-size: 13px;">[G] 캡슐: 혜성 화염 관통 모드</p>
    <button class="btn" onclick="startGame()">게임 시작</button>
  </div>

  <div class="overlay" id="gameOverOverlay" style="display: none;">
    <h1 id="overTitle" style="color: #ff3333;">GAME OVER</h1>
    <p id="finalScore" style="font-size: 16px;">점수: 0</p>
    <button class="btn" onclick="startGame()">다시하기</button>
  </div>

  <script>
    // --- 1. 유튜브 IFrame 플레이어 컨트롤 ---
    let ytPlayer = null;
    const TARGET_VIDEO_ID = 'a3q2dPG3lVI';

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('ytPlayer', {
        videoId: TARGET_VIDEO_ID,
        playerVars: {
          autoplay: 1,
          mute: 1,
          controls: 0,
          disablekb: 1,
          fs: 0,
          rel: 0,
          modestbranding: 1,
          playsinline: 1,
          loop: 1,
          playlist: TARGET_VIDEO_ID
        },
        events: {
          onReady: (e) => {
            e.target.mute();
            e.target.playVideo();
          }
        }
      });
    }

    function ensureYouTubePlay() {
      if (ytPlayer && ytPlayer.playVideo) {
        ytPlayer.mute();
        ytPlayer.playVideo();
      }
    }

    // --- 2. 사운드 FX 엔진 ---
    let audioCtx = null;
    const startAudio = new Audio('start.wav');
    startAudio.preload = 'auto';

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playStartWav() {
      try {
        startAudio.currentTime = 0;
        startAudio.play().catch(() => {});
      } catch (e) {}
    }

    function playTone(freq, type, duration, endFreq = null, vol = 0.15) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (endFreq) {
          osc.frequency.exponentialRampToValueAtTime(endFreq, now + duration);
        }

        gain.gain.setValueAtTime(vol, now);
        gain.gain.linearRampToValueAtTime(0.01, now + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + duration);
      } catch (e) {}
    }

    const sound = {
      hitBrickByType: (type, isDestroyed) => {
        if (type === 'GOLD') {
          playTone(220, 'square', 0.12, isDestroyed ? 90 : 160, 0.22);
        } else if (type === 'SILVER') {
          playTone(340, 'triangle', 0.1, isDestroyed ? 140 : 260, 0.2);
        } else if (type === 'GLASS') {
          playTone(1050, 'sine', 0.18, 1400, 0.25);
          setTimeout(() => playTone(1580, 'sine', 0.12, 1900, 0.18), 30);
        } else if (type === 'RED') {
          playTone(440, 'square', 0.08, 520, 0.15);
        } else if (type === 'ORANGE') {
          playTone(494, 'square', 0.08, 580, 0.15);
        } else if (type === 'YELLOW') {
          playTone(554, 'square', 0.08, 660, 0.15);
        } else if (type === 'GREEN') {
          playTone(659, 'square', 0.08, 780, 0.15);
        } else {
          playTone(740, 'square', 0.08, 880, 0.15);
        }
      },
      hitPaddle: () => playTone(220, 'triangle', 0.12, 110, 0.2),
      hitWall: () => playTone(440, 'sine', 0.04, null, 0.08),
      powerUp: () => {
        playTone(400, 'square', 0.08, null, 0.2);
        setTimeout(() => playTone(600, 'square', 0.08, null, 0.2), 70);
        setTimeout(() => playTone(800, 'square', 0.14, null, 0.2), 140);
      },
      loseLife: () => playTone(250, 'sawtooth', 0.35, 40, 0.25)
    };

    // --- 3. 캔버스 및 레이아웃 설정 ---
    const container = document.getElementById('gameContainer');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const overTitle = document.getElementById('overTitle');
    const finalScore = document.getElementById('finalScore');

    const GAME_W = 360;
    const GAME_H = 640;

    function resizeContainer() {
      const scale = Math.min(window.innerWidth / GAME_W, window.innerHeight / GAME_H);
      const w = Math.floor(GAME_W * scale);
      const h = Math.floor(GAME_H * scale);

      container.style.width = `${w}px`;
      container.style.height = `${h}px`;

      canvas.width = GAME_W * scale;
      canvas.height = GAME_H * scale;
      ctx.imageSmoothingEnabled = true;
    }
    window.addEventListener('resize', resizeContainer);
    resizeContainer();

    let score = 0;
    let lives = 3;
    let isPlaying = false;
    let frameCount = 0;

    const PADDLE_DEFAULT_W = 68;
    const paddle = {
      w: PADDLE_DEFAULT_W,
      h: 14,
      x: GAME_W / 2 - 34,
      y: GAME_H - 135
    };
    let balls = [];
    let particles = [];
    const BASE_BALL_R = 4.5;
    const BASE_BALL_SPEED = 4.8;

    let items = [];
    const ITEM_TYPES = [
      { type: 'MULTI', label: 'M', color: '#00ffff' },
      { type: 'GIANT_PIERCE', label: 'G', color: '#ff0055' },
      { type: 'EXPAND', label: 'E', color: '#39ff14' }
    ];
    let activeEffects = {
      giantPierceTimer: 0,
      expandTimer: 0
    };

    const BRICK_ROWS = 7;
    const BRICK_COLS = 11;
    const BRICK_W = 28;
    const BRICK_H = 12;
    const BRICK_TOP = 80;
    const BRICK_LEFT = (GAME_W - (BRICK_COLS * BRICK_W)) / 2;

    let bricks = [];
    function initBricks() {
      bricks = [];
      for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
          let maxHp = 1;
          let color = '#e52521';
          let type = 'RED';

          if (r === 0) {
            maxHp = 3;
            color = '#ffd700';
            type = 'GOLD';
          } else if (r === 1) {
            maxHp = 2;
            color = '#c0c0c0';
            type = 'SILVER';
          } else if (r === 2) {
            maxHp = 1;
            color = '#7df9ff';
            type = 'GLASS';
          } else if (r === 3) {
            color = '#ff5f00';
            type = 'ORANGE';
          } else if (r === 4) {
            color = '#fbd100';
            type = 'YELLOW';
          } else if (r === 5) {
            color = '#009a44';
            type = 'GREEN';
          } else {
            color = '#0070ec';
            type = 'BLUE';
          }

          bricks.push({
            x: BRICK_LEFT + c * BRICK_W,
            y: BRICK_TOP + r * BRICK_H,
            w: BRICK_W - 1.5,
            h: BRICK_H - 1.5,
            hp: maxHp,
            maxHp: maxHp,
            baseColor: color,
            type: type
          });
        }
      }
    }

    function spawnExplosion(x, y, w, h, color, isGlass) {
      const count = isGlass ? 20 : 14;
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x + w / 2,
          y: y + h / 2,
          vx: (Math.random() - 0.5) * 8.5,
          vy: (Math.random() - 0.8) * 7.5,
          size: Math.random() * 3.5 + 2.0,
          color: color,
          alpha: 1.0,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.3,
          isGlass: isGlass
        });
      }
    }

    function createBall(x, y, dx, dy) {
      return {
        x: x,
        y: y,
        dx: dx,
        dy: dy,
        speed: BASE_BALL_SPEED,
        hitCooldown: 0,
        trail: []
      };
    }

    function resetToSingleBall() {
      balls = [createBall(paddle.x + paddle.w / 2, paddle.y - 12, (Math.random() > 0.5 ? 1 : -1) * 3, -3.8)];
    }

    function startGame() {
      initAudio();
      playStartWav();
      ensureYouTubePlay();

      score = 0;
      lives = 3;
      items = [];
      particles = [];
      activeEffects.giantPierceTimer = 0;
      activeEffects.expandTimer = 0;
      paddle.w = PADDLE_DEFAULT_W;
      paddle.x = GAME_W / 2 - paddle.w / 2;

      initBricks();
      resetToSingleBall();

      startOverlay.style.display = 'none';
      gameOverOverlay.style.display = 'none';
      isPlaying = true;
      requestAnimationFrame(loop);
    }

    function handleTouch(e) {
      if (!isPlaying) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = GAME_W / rect.width;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const touchX = (clientX - rect.left) * scaleX;
      paddle.x = Math.max(12, Math.min(GAME_W - paddle.w - 12, touchX - paddle.w / 2));
    }

    ['pointermove', 'touchmove', 'pointerdown', 'touchstart'].forEach(type => {
      window.addEventListener(type, handleTouch, { passive: true });
    });

    function maybeSpawnItem(x, y) {
      if (Math.random() < 0.22) {
        const it = ITEM_TYPES[Math.floor(Math.random() * ITEM_TYPES.length)];
        items.push({
          x: x + BRICK_W / 2,
          y: y + BRICK_H / 2,
          w: 22,
          h: 12,
          type: it.type,
          label: it.label,
          color: it.color,
          speed: 2.2
        });
      }
    }

    function applyPowerUp(type) {
      sound.powerUp();
      if (type === 'MULTI') {
        if (balls.length > 0) {
          const b = balls[0];
          balls.push(createBall(b.x, b.y, -3.2, -3.2));
          balls.push(createBall(b.x, b.y, 3.2, -3.2));
        }
      } else if (type === 'GIANT_PIERCE') {
        activeEffects.giantPierceTimer = 480;
      } else if (type === 'EXPAND') {
        activeEffects.expandTimer = 480;
        paddle.w = PADDLE_DEFAULT_W * 1.5;
      }
    }

    // --- 4. 물리 및 판정 업데이트 ---
    function update() {
      frameCount++;
      if (activeEffects.giantPierceTimer > 0) activeEffects.giantPierceTimer--;
      if (activeEffects.expandTimer > 0) {
        activeEffects.expandTimer--;
        if (activeEffects.expandTimer === 0) paddle.w = PADDLE_DEFAULT_W;
      }

      const isGiant = activeEffects.giantPierceTimer > 0;
      const currentRadius = isGiant ? BASE_BALL_R * 2.8 : BASE_BALL_R;

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.24;
        p.rot += p.vRot;
        p.alpha -= 0.024;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      for (let i = balls.length - 1; i >= 0; i--) {
        const ball = balls[i];
        if (isGiant) {
          ball.trail.unshift({ x: ball.x, y: ball.y });
          if (ball.trail.length > 14) ball.trail.pop();
        } else {
          ball.trail = [];
        }

        ball.x += ball.dx;
        ball.y += ball.dy;
        if (ball.hitCooldown > 0) ball.hitCooldown--;

        if (ball.x - currentRadius < 14) {
          ball.x = 14 + currentRadius;
          ball.dx = Math.abs(ball.dx);
          sound.hitWall();
        } else if (ball.x + currentRadius > GAME_W - 14) {
          ball.x = GAME_W - 14 - currentRadius;
          ball.dx = -Math.abs(ball.dx);
          sound.hitWall();
        }
        if (ball.y - currentRadius < 40) {
          ball.y = 40 + currentRadius;
          ball.dy = Math.abs(ball.dy);
          sound.hitWall();
        }

        if (
          ball.y + currentRadius >= paddle.y &&
          ball.y - currentRadius <= paddle.y + paddle.h &&
          ball.x >= paddle.x &&
          ball.x <= paddle.x + paddle.w &&
          ball.dy > 0
        ) {
          const hitPos = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
          ball.dx = hitPos * 4.6;
          ball.dy = -Math.sqrt(Math.max(4, ball.speed * ball.speed - ball.dx * ball.dx));
          ball.y = paddle.y - currentRadius;
          sound.hitPaddle();
        }

        for (let b of bricks) {
          if (b.hp <= 0) continue;
          if (
            ball.x + currentRadius > b.x &&
            ball.x - currentRadius < b.x + b.w &&
            ball.y + currentRadius > b.y &&
            ball.y - currentRadius < b.y + b.h
          ) {
            if (isGiant) {
              b.hp = 0;
              score += 20;
              sound.hitBrickByType(b.type, true);
              spawnExplosion(b.x, b.y, b.w, b.h, getBrickColor(b), b.type === 'GLASS');
              maybeSpawnItem(b.x, b.y);
            } else {
              if (ball.hitCooldown === 0) {
                b.hp--;
                score += 10;
                ball.dy = -ball.dy;
                ball.hitCooldown = 3;
                const destroyed = b.hp <= 0;
                sound.hitBrickByType(b.type, destroyed);
                if (destroyed) {
                  spawnExplosion(b.x, b.y, b.w, b.h, getBrickColor(b), b.type === 'GLASS');
                  maybeSpawnItem(b.x, b.y);
                }
              }
              break;
            }
          }
        }

        if (ball.y - currentRadius > GAME_H) {
          balls.splice(i, 1);
        }
      }

      if (balls.length === 0) {
        lives--;
        sound.loseLife();
        activeEffects.giantPierceTimer = 0;
        activeEffects.expandTimer = 0;
        paddle.w = PADDLE_DEFAULT_W;
        if (lives <= 0) {
          gameOver(false);
          return;
        } else {
          resetToSingleBall();
        }
      }

      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.y += it.speed;

        if (
          it.x + it.w / 2 >= paddle.x &&
          it.x - it.w / 2 <= paddle.x + paddle.w &&
          it.y + it.h / 2 >= paddle.y &&
          it.y - it.h / 2 <= paddle.y + paddle.h
        ) {
          applyPowerUp(it.type);
          score += 50;
          items.splice(i, 1);
          continue;
        }

        if (it.y > GAME_H) items.splice(i, 1);
      }

      if (bricks.every(b => b.hp <= 0)) {
        gameOver(true);
      }
    }

    function gameOver(win) {
      isPlaying = false;
      overTitle.textContent = win ? "ROUND CLEAR!" : "GAME OVER";
      overTitle.style.color = win ? "#4cd964" : "#ff3333";
      finalScore.textContent = `최종 점수: ${score}`;
      gameOverOverlay.style.display = 'flex';
    }

    function getBrickColor(b) {
      if (b.type === 'GOLD') {
        if (b.hp === 3) return '#ffd700';
        if (b.hp === 2) return '#cd7f32';
        return '#654321';
      }
      if (b.type === 'SILVER') {
        if (b.hp === 2) return '#dcdcdc';
        return '#708090';
      }
      return b.baseColor;
    }

    // --- 5. 렌더링 ---
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const scale = canvas.width / GAME_W;
      ctx.save();
      ctx.scale(scale, scale);

      // 상단 및 좌우 메탈 프레임
      ctx.fillStyle = '#7a7a85';
      ctx.fillRect(0, 36, 12, GAME_H);
      ctx.fillRect(GAME_W - 12, 36, 12, GAME_H);
      ctx.fillRect(0, 24, GAME_W, 12);

      // 상단 점수 바 배경
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, GAME_W, 24);

      // HUD
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px Courier New';
      ctx.fillText(`SCORE: ${score}`, 18, 18);
      ctx.fillStyle = '#e60012';
      ctx.fillText(`LIVES: ${'● '.repeat(lives)}`, GAME_W - 105, 18);

      if (activeEffects.giantPierceTimer > 0) {
        ctx.fillStyle = '#ff3300';
        ctx.fillText(`[COMET FIRE] ${(activeEffects.giantPierceTimer / 60).toFixed(1)}s`, 18, 48);
      } else if (activeEffects.expandTimer > 0) {
        ctx.fillStyle = '#39ff14';
        ctx.fillText(`[EXPAND] ${(activeEffects.expandTimer / 60).toFixed(1)}s`, 18, 48);
      }

      // 벽돌
      for (let b of bricks) {
        if (b.hp <= 0) continue;
        if (b.type === 'GLASS') {
          ctx.fillStyle = 'rgba(125, 249, 255, 0.65)';
          ctx.fillRect(b.x, b.y, b.w, b.h);

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.lineWidth = 1;
          ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);

          const sweep = (frameCount * 2.5 + b.x * 2) % 180;
          if (sweep < b.w + 10) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(b.x, b.y, b.w, b.h);
            ctx.clip();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.beginPath();
            ctx.moveTo(b.x + sweep - 6, b.y + b.h);
            ctx.lineTo(b.x + sweep + 4, b.y);
            ctx.lineTo(b.x + sweep + 8, b.y);
            ctx.lineTo(b.x + sweep - 2, b.y + b.h);
            ctx.fill();
            ctx.restore();
          }
        } else {
          ctx.fillStyle = getBrickColor(b);
          ctx.fillRect(b.x, b.y, b.w, b.h);
          ctx.fillStyle = 'rgba(255,255,255,0.45)';
          ctx.fillRect(b.x, b.y, b.w, 2);
          ctx.fillStyle = 'rgba(0,0,0,0.4)';
          ctx.fillRect(b.x, b.y + b.h - 2, b.w, 2);
        }
      }

      // 파티클
      for (let p of particles) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        if (p.isGlass) {
          ctx.shadowColor = '#ffffff';
          ctx.shadowBlur = 6;
        }
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      }

      // 캡슐 아이템
      for (let it of items) {
        ctx.fillStyle = it.color;
        ctx.beginPath();
        ctx.roundRect(it.x - it.w / 2, it.y - it.h / 2, it.w, it.h, 6);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.font = 'bold 10px Courier New';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(it.label, it.x, it.y);
      }
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';

      // 패들
      ctx.fillStyle = activeEffects.expandTimer > 0 ? '#39ff14' : '#e52521';
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(paddle.x + 8, paddle.y + 2, paddle.w - 16, paddle.h - 4);

      // 공
      const isGiant = activeEffects.giantPierceTimer > 0;
      const r = isGiant ? BASE_BALL_R * 2.8 : BASE_BALL_R;
      for (let ball of balls) {
        if (isGiant && ball.trail.length > 0) {
          for (let t = ball.trail.length - 1; t >= 0; t--) {
            const pt = ball.trail[t];
            const ratio = 1 - (t / ball.trail.length);
            const trailR = r * (0.35 + ratio * 0.55);

            ctx.beginPath();
            ctx.arc(pt.x, pt.y, trailR, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, ${Math.floor(140 * ratio)}, 0, ${ratio * 0.6})`;
            ctx.shadowColor = '#ff2200';
            ctx.shadowBlur = 10 * ratio;
            ctx.fill();
          }
        }

        ctx.beginPath();
        ctx.arc(ball.x, ball.y, r, 0, Math.PI * 2);
        if (isGiant) {
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#ff3300';
          ctx.shadowBlur = 18;
          ctx.fill();

          ctx.beginPath();
          ctx.arc(ball.x, ball.y, r * 1.15, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 80, 0, 0.7)';
          ctx.lineWidth = 2.5;
          ctx.stroke();
        } else {
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#00ffff';
          ctx.shadowBlur = 6;
          ctx.fill();
        }
        ctx.shadowBlur = 0;
      }

      // 하단 터치 가이드 라인
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(12, GAME_H - 105);
      ctx.lineTo(GAME_W - 12, GAME_H - 105);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.restore();
    }

    function loop() {
      if (!isPlaying) return;
      update();
      draw();
      requestAnimationFrame(loop);
    }

    draw();
  </script>
</body>
</html>
